<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>
		gem5{% if page.title And page.title != "" And page.title != nil%}: {{page.title}} {% endif %}
	</title>

	{% if page.canonical And page.canonical != "" And page.canonical != nil%}
	<link rel="canonical" href="{{page.canonical}}"/>
	{% else %}
	<!-- 规范链接指向同一路径的官方英文页面 -->
	<link rel="canonical" href="{{ site.english_url }}{{ page.url | replace:'index.html','' }}"/>
	{% endif %}

	<!-- 站点图标（带 baseurl，适配 GitHub Pages 项目子路径） -->
	<link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | prepend: site.baseurl }}">
	<link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | prepend: site.baseurl }}">
	<link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16x16.png' | prepend: site.baseurl }}">
	<link rel="manifest" href="{{ '/site.webmanifest' | prepend: site.baseurl }}">
	<link rel="mask-icon" href="{{ '/safari-pinned-tab.svg' | prepend: site.baseurl }}" color="#5bbad5">
	<meta name="msapplication-TileColor" content="#da532c">
	<meta name="theme-color" content="#ffffff">

	<link href='https://fonts.googleapis.com/css?family=Open+Sans:400,300,700,800,600' rel='stylesheet' type='text/css'>
	<link href='https://fonts.googleapis.com/css?family=Muli:400,300' rel='stylesheet' type='text/css'>

	<!-- BOOTSTRAP -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

	<!-- 自定义 CSS -->
	<link rel="stylesheet" href="{{ '/css/main.css' | prepend: site.baseurl }}">

	<!-- 中文排版字体：只作用于正文与标题，代码块保持等宽字体，避免破坏 ASCII 图与表格对齐 -->
	<style>
		body, h1, h2, h3, h4, h5, h6, .navbar, button, input, .btn-main-link {
			font-family: "Open Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
		}
		pre, code, kbd, samp {
			font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
		}
	</style>
</head>
